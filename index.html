<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusVote – Online Voting System</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mu:#5d6676;--ac:#2f5fd0;--on:#fff;--bd:#dde1ea;--ok:#1d7a46;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1d212c;--tx:#e8eaf0;--mu:#9aa3b5;--ac:#7ea2ff;--on:#10131a;--bd:#2f3544;--ok:#5fd08e;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1d212c;--tx:#e8eaf0;--mu:#9aa3b5;--ac:#7ea2ff;--on:#10131a;--bd:#2f3544;--ok:#5fd08e;--er:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
h1{font-size:1.3rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.bad{background:var(--er)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.mu{color:var(--mu);font-size:.9rem}
.msg{background:var(--card);border-left:4px solid var(--ac);padding:10px 12px;border-radius:6px;margin-bottom:12px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--ac)}
.tag{font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.ok{color:var(--ok)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='campusvote_v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{users:[],positions:[],cands:[],votes:[],voted:[],state:'setup'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let me=null,mode='login',msg='';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>document.getElementById(id).value.trim();
const uid=()=>Math.random().toString(36).slice(2,10);
async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const uname=id=>(S.users.find(u=>u.id===id)||{name:'?'}).name;

function authView(){
  const reg=mode==='reg';
  return `<div class="card"><h2>${reg?'Create an account':'Log in'}</h2>
  ${reg?`<label>Full name</label><input id="n" autocomplete="name">`:''}
  <label>${reg?'Registration number or email':'Registration number or email'}</label><input id="e" autocomplete="username">
  <label>Password</label><input id="p" type="password" autocomplete="${reg?'new-password':'current-password'}">
  ${reg?`<label>I am registering as</label><select id="r"><option value="voter">Voter</option><option value="candidate">Candidate</option></select>`:''}
  <button data-a="${reg?'reg':'login'}">${reg?'Register':'Log in'}</button>
  <button class="ghost" data-a="mode">${reg?'Back to login':'Create account'}</button>
  ${reg?'':'<p class="mu">Demo admin: <b>admin</b> / <b>admin123</b></p>'}</div>`;
}

function results(){
  if(!S.positions.length)return '<p class="mu">No positions yet.</p>';
  return S.positions.map(p=>{
    const cs=S.cands.filter(c=>c.pos===p.id&&c.ok);
    const tot=S.votes.filter(v=>v.pos===p.id).length;
    const rows=cs.map(c=>{const n=S.votes.filter(v=>v.c===c.id).length;const pc=tot?Math.round(n*100/tot):0;
      return `<div class="row"><span style="min-width:120px">${esc(uname(c.uid))}</span><div class="bar"><i style="width:${pc}%"></i></div><span>${n} (${pc}%)</span></div>`}).join('')||'<p class="mu">No approved candidates.</p>';
    return `<h2>${esc(p.title)} <span class="tag">${tot} votes</span></h2>${rows}`}).join('<br>');
}

function adminView(){
  const pend=S.cands.filter(c=>!c.ok);
  const st={setup:'Not started',open:'Voting open',closed:'Voting closed'}[S.state];
  return `<div class="card"><h2>Election control <span class="tag">${st}</span></h2>
  <button data-a="${S.state==='open'?'close':'open'}" ${S.state==='open'?'class="bad"':''}>${S.state==='open'?'Close voting':'Open voting'}</button>
  <button class="ghost" data-a="reset">Reset all votes</button>
  <p class="mu">Registered voters: ${S.users.filter(u=>u.role==='voter').length} · Votes cast: ${S.voted.length}</p></div>
  <div class="card"><h2>Positions</h2>
  <input id="pt" placeholder="e.g. Chairperson"><button data-a="addpos">Add position</button>
  ${S.positions.map(p=>`<div class="row"><span>${esc(p.title)}</span><button class="ghost" data-a="delpos" data-id="${p.id}">Remove</button></div>`).join('')}</div>
  <div class="card"><h2>Candidate applications</h2>
  ${pend.map(c=>`<div class="row"><span>${esc(uname(c.uid))} → ${esc((S.positions.find(p=>p.id===c.pos)||{title:'?'}).title)}<br><span class="mu">${esc(c.man)}</span></span><span><button data-a="appr" data-id="${c.id}">Approve</button> <button class="bad" data-a="rej" data-id="${c.id}">Reject</button></span></div>`).join('')||'<p class="mu">No pending applications.</p>'}</div>
  <div class="card"><h2>Live results</h2>${results()}</div>`;
}

function candView(){
  const mine=S.cands.find(c=>c.uid===me.id);
  let body;
  if(mine){const p=S.positions.find(p=>p.id===mine.pos);
    body=`<p>Applied for <b>${esc(p?p.title:'?')}</b> — <span class="${mine.ok?'ok':'mu'}">${mine.ok?'Approved':'Awaiting admin approval'}</span></p><p class="mu">${esc(mine.man)}</p>`;
  }else if(!S.positions.length){body='<p class="mu">No positions are open yet. Check back later.</p>'}
  else{body=`<label>Position</label><select id="cp">${S.positions.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select>
    <label>Manifesto</label><textarea id="cm" rows="4"></textarea><button data-a="apply">Submit application</button>`}
  return `<div class="card"><h2>My candidacy</h2>${body}</div>`+(S.state==='closed'?`<div class="card"><h2>Results</h2>${results()}</div>`:'');
}

function voterView(){
  if(S.state==='setup')return '<div class="card"><p>Voting has not started yet.</p></div>';
  if(S.state==='closed')return `<div class="card"><h2>Final results</h2>${results()}</div>`;
  return S.positions.map(p=>{
    const done=S.voted.some(v=>v.u===me.id&&v.pos===p.id);
    const cs=S.cands.filter(c=>c.pos===p.id&&c.ok);
    const list=done?'<p class="ok">✓ Your vote has been recorded.</p>':
      cs.map(c=>`<div class="row"><span><b>${esc(uname(c.uid))}</b><br><span class="mu">${esc(c.man)}</span></span><button data-a="vote" data-pos="${p.id}" data-id="${c.id}">Vote</button></div>`).join('')||'<p class="mu">No candidates for this position.</p>';
    return `<div class="card"><h2>${esc(p.title)}</h2>${list}</div>`}).join('')||'<div class="card"><p class="mu">No positions on the ballot.</p></div>';
}

function render(){
  const m=msg?`<div class="msg">${esc(msg)}</div>`:'';msg='';
  const body=!me?authView():{admin:adminView,candidate:candView,voter:voterView}[me.role]();
  app.innerHTML=`<header><h1>🗳️ CampusVote</h1>${me?`<span class="mu">${esc(me.name)} · ${me.role} <button class="ghost" data-a="out">Log out</button></span>`:''}</header>${m}${body}`;
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='mode'){mode=mode==='reg'?'login':'reg'}
  else if(a==='reg'){
    const n=val('n'),em=val('e').toLowerCase(),p=document.getElementById('p').value,r=val('r');
    if(!n||!em||p.length<6)msg='Fill every field; password must be at least 6 characters.';
    else if(S.users.some(u=>u.email===em))msg='That registration number or email is already registered.';
    else{S.users.push({id:uid(),name:n,email:em,hash:await hash(p),role:r});save();mode='login';msg='Account created. Please log in.'}
  }
  else if(a==='login'){
    const u=S.users.find(u=>u.email===val('e').toLowerCase());
    if(u&&u.hash===await hash(document.getElementById('p').value))me=u;else msg='Wrong credentials.';
  }
  else if(a==='out'){me=null;mode='login'}
  else if(a==='addpos'){const t=val('pt');if(t){S.positions.push({id:uid(),title:t});save()}}
  else if(a==='delpos'){S.positions=S.positions.filter(p=>p.id!==id);S.cands=S.cands.filter(c=>c.pos!==id);save()}
  else if(a==='open'){if(!S.positions.length)msg='Add at least one position first.';else{S.state='open';save()}}
  else if(a==='close'){S.state='closed';save()}
  else if(a==='reset'){if(confirm('Clear all votes and reset voting?')){S.votes=[];S.voted=[];S.state='setup';save()}}
  else if(a==='appr'){S.cands.find(c=>c.id===id).ok=true;save()}
  else if(a==='rej'){S.cands=S.cands.filter(c=>c.id!==id);save()}
  else if(a==='apply'){
    const man=val('cm');
    if(!man)msg='Please write a short manifesto.';
    else{S.cands.push({id:uid(),uid:me.id,pos:val('cp'),man,ok:false});save();msg='Application submitted.'}
  }
  else if(a==='vote'){
    const pos=b.dataset.pos;
    if(S.state!=='open')msg='Voting is not open.';
    else if(S.voted.some(v=>v.u===me.id&&v.pos===pos))msg='You already voted for this position.';
    else{S.votes.push({pos,c:id});S.voted.push({u:me.id,pos});save();msg='Vote recorded. Thank you!'}
  }
  render();
});

(async()=>{
  if(!S.users.some(u=>u.role==='admin')){
    S.users.push({id:'admin',name:'Administrator',email:'admin',hash:await hash('admin123'),role:'admin'});save();
  }
  render();
})();
</script>
</body>
</html>
